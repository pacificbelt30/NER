<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ログイン — NER</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <script src="/assets/login.js" type="module"></script>
  </head>
  <body class="login-page">
    <main class="login-container">
      <a class="brand" href="/login" aria-label="NER"><span class="brand-mark" aria-hidden="true">N</span>NER</a>
      <section class="settings-card login-card" aria-labelledby="login-title">
        <p class="eyebrow">PDF TRANSLATOR</p>
        <h1 id="login-title">ログイン</h1>
        <p class="muted">翻訳と保存したPDFにアクセスします。</p>
        <form id="login-form">
          <label class="field-label" for="login-username">ユーザー名</label>
          <input id="login-username" name="username" autocomplete="username" required maxlength="128" autofocus />
          <label class="field-label" for="login-password">パスワード</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="1024" />
          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button id="login-submit" class="primary-button" type="submit" disabled>ログインする</button>
        </form>
        <p id="login-setup" class="setup-message" hidden>初回設定が必要です。サーバー上で <code>python -m ner.auth setup</code> を実行し、アカウントを作成してからサーバーを再起動してください。</p>
        <p id="login-status" class="muted" role="status">ログイン設定を確認しています…</p>
      </section>
    </main>
  </body>
</html>
